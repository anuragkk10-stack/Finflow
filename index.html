<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B4F"><title>FinFlow</title>
<style>
:root{--bg:#f6f7f6;--card:#fff;--tx:#14201b;--mu:#66736d;--ac:#0F6B4F;--bd:#e3e8e5;--red:#dc2626;--grn:#0F6B4F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--card:#17211c;--tx:#eaf1ed;--mu:#93a39a;--ac:#34b58a;--bd:#25322b;--red:#f87171;--grn:#34b58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1512;--card:#17211c;--tx:#eaf1ed;--mu:#93a39a;--ac:#34b58a;--bd:#25322b;--red:#f87171;--grn:#34b58a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0 14px}h2{font-size:12px;color:var(--mu);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:32px;font-weight:700}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.l{display:flex;align-items:center;gap:10px}small,.mu{color:var(--mu)}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0;font-size:11px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px #0004}
.in{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:10px;font:inherit}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600}
.g{background:none;border:1px solid var(--bd);color:var(--tx)}.x{background:none;border:0;color:var(--mu);font-size:12px;padding:2px 0}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg .b{flex:1}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--tx)}dialog::backdrop{background:#0008}
textarea.in{min-height:90px}
</style></head><body>
<main id="v"></main>
<button class="fab" onclick="openAdd()" aria-label="Add transaction">+</button>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>Home</button>
<button data-t="act" onclick="go('act')"><span>🧾</span>Activity</button>
<button data-t="bud" onclick="go('bud')"><span>🎯</span>Budgets</button>
<button data-t="goal" onclick="go('goal')"><span>🐷</span>Goals</button>
<button data-t="set" onclick="go('set')"><span>⚙️</span>Settings</button>
</nav>
<dialog id="dlg">
<div class="seg"><button class="b" id="k0" onclick="setKind(0)">Expense</button><button class="b g" id="k1" onclick="setKind(1)">Income</button></div>
<input class="in" id="ta" type="number" inputmode="decimal" placeholder="Amount">
<select class="in" id="tc"></select>
<input class="in" id="tn" maxlength="80" placeholder="Note (optional)">
<input class="in" id="td" type="date">
<div class="row"><button class="b g" onclick="dlg.close()">Cancel</button><button class="b" onclick="saveTx()">Save</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s),K='finflow:v1',dlg=$('#dlg');
const CATS=[['Food & Dining','🍽️','#F97316',0],['Transport','🚗','#0EA5E9',0],['Shopping','🛍️','#8B5CF6',0],['Bills & Utilities','🧾','#EF4444',0],['Entertainment','🎬','#EC4899',0],['Health','💊','#14B8A6',0],['Education','🎓','#6366F1',0],['Other','🏷️','#64748B',0],['Salary','💼','#0F6B4F',1],['Business','🏪','#0891B2',1],['Investments','📈','#CA8A04',1],['Gifts','🎁','#DB2777',1]].map(([n,i,c,k])=>({n,i,c,k}));
const cat=n=>CATS.find(x=>x.n===n)||CATS[7];
let S={tx:[],bud:[],goals:[],cur:'INR',theme:'system'},tab='home',kind=0;
let ok=true;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));ok=true}catch(e){ok=false}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur,minimumFractionDigits:0,maximumFractionDigits:2}).format(n)}catch(e){return n}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sum=a=>a.reduce((s,t)=>s+t.a,0),ym=()=>today().slice(0,7);
const CUR=['INR','USD','EUR','GBP','AED','JPY'],NUM=v=>{v=Number(v);return isFinite(v)&&v>0&&v<1e12?v:0},STR=(v,n)=>String(v==null?'':v).slice(0,n);
function clean(d){d=d&&typeof d==='object'?d:{};const arr=x=>Array.isArray(x)?x.slice(0,20000):[],ids=new Set(),id=v=>{v=typeof v==='string'&&/^[a-z0-9]{1,24}$/.test(v)&&!ids.has(v)?v:uid();ids.add(v);return v};
 return{cur:CUR.includes(d.cur)?d.cur:'INR',theme:['system','light','dark'].includes(d.theme)?d.theme:'system',
 tx:arr(d.tx).filter(t=>t&&NUM(t.a)&&/^\d{4}-\d{2}-\d{2}$/.test(t.d)).map(t=>({id:id(t.id),k:t.k?1:0,a:NUM(t.a),c:CATS.some(c=>c.n===t.c)?t.c:'Other',n:STR(t.n,80),d:t.d})),
 bud:arr(d.bud).filter(b=>b&&NUM(b.a)&&CATS.some(c=>c.n===b.c&&!c.k)).map(b=>({c:b.c,a:NUM(b.a)})),
 goals:arr(d.goals).filter(g=>g&&NUM(g.t)&&STR(g.n,60).trim()).map(g=>({id:id(g.id),n:STR(g.n,60),t:NUM(g.t),s:Math.min(Math.max(Number(g.s)||0,0),1e12)}))}}
try{S=clean(JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=clean({})}
const mExp=()=>S.tx.filter(t=>!t.k&&t.d.startsWith(ym()));
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${c}"></i></div>`;
const row=t=>{const c=cat(t.c);return `<div class="card row" style="padding:10px 12px"><div class="l"><span class="dot" style="background:${c.c}22">${c.i}</span><div><b>${esc(t.n||t.c)}</b><br><small>${esc(t.c)} · ${t.d}</small></div></div><div style="text-align:right"><b style="color:${t.k?'var(--grn)':'var(--red)'}">${t.k?'+':'−'}${money(t.a)}</b><br><button class="x" onclick="del('${t.id}')">Delete</button></div></div>`};
const empty=m=>`<div class="card mu" style="text-align:center">${m}</div>`;
const V={
home(){
 const all=S.tx,bal=sum(all.filter(t=>t.k))-sum(all.filter(t=>!t.k)),m=mExp(),me=sum(m),mi=sum(S.tx.filter(t=>t.k&&t.d.startsWith(ym())));
 const g={};m.forEach(t=>g[t.c]=(g[t.c]||0)+t.a);
 const top=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<h1>FinFlow</h1>${ok?'':'<div class="card" style="color:var(--red)">Storage is blocked in this browser, so your data will not be kept after you close the page.</div>'}<div class="card"><h2>Balance</h2><div class="big">${money(bal)}</div></div>
 <div class="row"><div class="card" style="flex:1"><h2>Income</h2><b style="color:var(--grn)">${money(mi)}</b><br><small>this month</small></div><div class="card" style="flex:1"><h2>Spent</h2><b style="color:var(--red)">${money(me)}</b><br><small>this month</small></div></div>
 <div class="card"><h2>Top spending</h2>${top.length?top.map(([n,v])=>`<div style="margin-bottom:10px"><div class="row"><span>${cat(n).i} ${esc(n)}</span><b>${money(v)}</b></div>${bar(v/me*100,cat(n).c)}</div>`).join(''):'<span class="mu">No expenses yet this month.</span>'}</div>
 <h2>Recent</h2>${all.length?[...all].reverse().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(row).join(''):empty('Tap + to add your first transaction.')}`},
act(){return `<h1>Activity</h1>${S.tx.length?[...S.tx].reverse().sort((a,b)=>b.d.localeCompare(a.d)).map(row).join(''):empty('Nothing here yet.')}`},
bud(){
 const g={};mExp().forEach(t=>g[t.c]=(g[t.c]||0)+t.a);
 return `<h1>Monthly budgets</h1><div class="card"><select class="in" id="bc">${CATS.filter(c=>!c.k).map(c=>`<option>${esc(c.n)}</option>`).join('')}</select><input class="in" id="ba" type="number" inputmode="decimal" placeholder="Budget amount"><button class="b" onclick="addBud()">Set budget</button></div>
 ${S.bud.length?S.bud.map(b=>{const s=g[b.c]||0,p=s/b.a*100;return `<div class="card"><div class="row"><b>${cat(b.c).i} ${esc(b.c)}</b><button class="x" onclick="delBud('${esc(b.c)}')">Remove</button></div><div class="row"><small>${money(s)} of ${money(b.a)}</small><small style="color:${p>100?'var(--red)':'var(--mu)'}">${p>100?'Over by '+money(s-b.a):money(b.a-s)+' left'}</small></div>${bar(p,p>100?'var(--red)':p>80?'#CA8A04':cat(b.c).c)}</div>`}).join(''):empty('No budgets yet.')}`},
goal(){return `<h1>Savings goals</h1><div class="card"><input class="in" id="gn" maxlength="60" placeholder="Goal name"><input class="in" id="gt" type="number" inputmode="decimal" placeholder="Target amount"><button class="b" onclick="addGoal()">Add goal</button></div>
 ${S.goals.length?S.goals.map(g=>{const p=g.s/g.t*100;return `<div class="card"><div class="row"><b>🐷 ${esc(g.n)}</b><button class="x" onclick="delGoal('${g.id}')">Remove</button></div><div class="row"><small>${money(g.s)} of ${money(g.t)}</small><small>${Math.round(p)}%</small></div>${bar(p,'var(--ac)')}<div class="row" style="margin-top:10px"><input class="in" id="f${g.id}" type="number" inputmode="decimal" placeholder="Add amount" style="margin:0"><button class="b" onclick="fund('${g.id}')">Add</button></div></div>`}).join(''):empty('No goals yet.')}`},
set(){return `<h1>Settings</h1><div class="card"><h2>Currency</h2><select class="in" onchange="S.cur=this.value;save();render()">${['INR','USD','EUR','GBP','AED','JPY'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select><h2>Theme</h2><select class="in" onchange="S.theme=this.value;save();render()">${['system','light','dark'].map(c=>`<option ${c===S.theme?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="card"><h2>Backup</h2><p class="mu" style="margin-top:0">Your data stays on this device only. Copy the backup text to keep it safe or move it to another device.</p><textarea class="in" id="bk" placeholder="Backup text appears here, or paste a backup to restore"></textarea><div class="row"><button class="b g" onclick="$('#bk').value=JSON.stringify(S);$('#bk').select()">Show backup</button><button class="b" onclick="restore()">Restore</button></div></div>
 <div class="card"><button class="b g" id="rs" onclick="reset(this)">Erase all data</button></div>`}};
function render(){document.documentElement.dataset.theme=S.theme==='system'?'':S.theme;$('#v').innerHTML=V[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function go(t){tab=t;render();window.scrollTo(0,0)}
function setKind(k){kind=k;$('#k0').className='b'+(k?' g':'');$('#k1').className='b'+(k?'':' g');$('#tc').innerHTML=CATS.filter(c=>c.k===k).map(c=>`<option>${esc(c.n)}</option>`).join('')}
function openAdd(){setKind(0);$('#ta').value='';$('#tn').value='';$('#td').value=today();dlg.showModal()}
function saveTx(){const a=parseFloat($('#ta').value);if(!NUM(a)){$('#ta').focus();return}S.tx.push({id:uid(),k:kind,a,c:$('#tc').value,n:$('#tn').value.trim(),d:$('#td').value||today()});save();dlg.close();render()}
function del(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function addBud(){const c=$('#bc').value,a=parseFloat($('#ba').value);if(!NUM(a))return;S.bud=S.bud.filter(b=>b.c!==c).concat({c,a});save();render()}
function delBud(c){S.bud=S.bud.filter(b=>b.c!==c);save();render()}
function addGoal(){const n=$('#gn').value.trim(),t=parseFloat($('#gt').value);if(!n||!NUM(t))return;S.goals.push({id:uid(),n,t,s:0});save();render()}
function fund(id){const v=parseFloat($('#f'+id).value),g=S.goals.find(x=>x.id===id);if(!g||!NUM(v))return;g.s+=v;save();render()}
function delGoal(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()}
function restore(){try{const d=JSON.parse($('#bk').value);if(!Array.isArray(d.tx))throw 0;S=clean(d);save();render()}catch(e){$('#bk').value='That text is not a valid backup.'}}
function reset(b){if(b.dataset.s){S={tx:[],bud:[],goals:[],cur:S.cur,theme:S.theme};save();render()}else{b.dataset.s=1;b.textContent='Tap again to erase everything'}}
render();
</script></body></html>
